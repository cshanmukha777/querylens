name: Bug report
description: Report a reproducible QueryLens problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Redact credentials, personal data, production SQL values, and database contents before posting.
  - type: input
    id: version
    attributes:
      label: QueryLens version
      description: For example, 0.1.0.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.13.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a minimal query with synthetic values and the exact API or CLI command.
      render: text
    validations:
      required: true
